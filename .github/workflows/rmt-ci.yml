name: RMT Java CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx1024m

jobs:
  compile:
    name: Compile Java 21 Project
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile test sources
        run: mvn -B -ntp -DskipTests test-compile

  uat-sanity:
    name: Run UAT Selenium Sanity Suite
    needs: compile
    runs-on: windows-latest
    environment: uat
    timeout-minutes: 45
    # The suite changes shared UAT data, so executions must never overlap.
    concurrency:
      group: rmt-shared-uat-sanity
      cancel-in-progress: false
    env:
      RMT_URL: ${{ secrets.RMT_URL }}
      RMT_USERNAME: ${{ secrets.RMT_USERNAME }}
      RMT_PASSWORD: ${{ secrets.RMT_PASSWORD }}
      RMT_ALLOCATION_SWITCH_USERNAME: ${{ secrets.RMT_ALLOCATION_SWITCH_USERNAME }}
      RMT_ALLOCATION_SWITCH_PASSWORD: ${{ secrets.RMT_ALLOCATION_SWITCH_PASSWORD }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ALLOCATION_VALIDATION_QUERY: ${{ secrets.ALLOCATION_VALIDATION_QUERY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate required UAT secrets
        shell: pwsh
        run: |
          $requiredSecrets = @(
            'RMT_URL',
            'RMT_USERNAME',
            'RMT_PASSWORD',
            'RMT_ALLOCATION_SWITCH_USERNAME',
            'RMT_ALLOCATION_SWITCH_PASSWORD'
          )
          $missingSecrets = $requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missingSecrets.Count -gt 0) {
            throw "The UAT run cannot start because these GitHub environment secrets are missing: $($missingSecrets -join ', ')."
          }

      - name: Run UAT sanity suite
        id: uat_tests
        continue-on-error: true
        shell: pwsh
        run: mvn -B -ntp clean test -Denv=uat -Dbrowser=edge -Dheadless=true

      - name: Generate CI summary
        if: ${{ always() }}
        shell: pwsh
        run: python ci/generate_ci_summary.py

      - name: Upload UAT diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rmt-uat-diagnostics-${{ github.run_number }}
          path: |
            artifacts/ci/
            target/surefire-reports/
            test_Logs/
            allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow when UAT tests fail
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ('${{ steps.uat_tests.outcome }}' -ne 'success') {
            throw 'The UAT sanity suite failed. Review the uploaded diagnostics artifact.'
          }
